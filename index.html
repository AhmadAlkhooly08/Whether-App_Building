<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/x-icon" href="./assets/images/1779940.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Weather app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <div class="navBar">
      <div class="logo">
        <img src="./assets/images/logo.svg" alt="" />
      </div>

      <div class="dropdown-Units">
        <div class="units">
          <button>
            <img src="./assets/images/icon-units.svg" alt="" />
            <p>Units</p>
            <img src="./assets/images/icon-dropdown.svg" alt="" />
          </button>
        </div>
        <div class="dropDown hidden">
          <button class="btn btn_imperial">Switch to Imperial</button>
          <div class="temprature">
            <h5 class="title">Temprature</h5>
            <button class="btn">
              Celsius(°C)
              <img
                class="img-check"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>
            <button class="btn">
              fahrenheit(°F)
              <img
                class="img-check hidden"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>
          </div>
          <hr />
          <div class="Wind-Speed">
            <h5 class="title">Wind Speed</h5>
            <button class="btn">
              Km/h
              <img
                class="img-check"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>
            <button class="btn">
              mph
              <img
                class="img-check hidden"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>
          </div>
          <hr />
          <div class="precipitation">
            <h5 class="title">precipitation</h5>
            <button class="btn">
              Millimeters(mm)
              <img
                class="img-check hidden"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>

            <button class="btn">
              Inches(in)
              <img
                class="img-check"
                src="./assets/images/icon-checkmark.svg"
                alt=""
              />
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Search for a city-->
    <div class="searchBar">
        <h1>How's the sky looking today?</h1>
        <div class="form">
          <input type="text" name="Search" placeholder= " Searche for a place...">
          <button>Search</button>
        </div>
    </div>

</html>
